<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087d8a">
  <meta name="description" content="陽明組織學實驗複習站。依考試練習老師講義、伴學講義與線上顯微鏡。">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>組織實驗複習站</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #18324b;
      --muted: #4e687a;
      --accent: #08717d;
      --line: #dce8ee;
      --soft: #eaf7fa;
      background: #f4f9fb;
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    .bar {
      width: min(100%, 1100px);
      margin-inline: auto;
      padding: .8rem clamp(1rem, 4vw, 1.75rem);
      display: flex; align-items: center; flex-wrap: wrap; gap: .5rem 1.25rem;
    }
    .brand { display: inline-flex; align-items: center; gap: .55rem; font-weight: 750; text-decoration: none; }
    .brand img { width: 1.7rem; height: 1.7rem; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem; }
    nav a { padding: .3rem .65rem; border-radius: .5rem; text-decoration: none; }
    nav a:hover, nav a[aria-current] { background: var(--soft); color: var(--accent); }
    main { display: flex; flex: 1; min-height: 0; }
    .home { width: 100%; overflow: auto; }
    .home-inner { max-width: 1100px; margin: auto; padding: clamp(2rem, 7vw, 4.75rem) clamp(1rem, 4vw, 1.75rem); }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.2; letter-spacing: -.035em; }
    .intro { margin: .65rem 0 1.75rem; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
    .card {
      padding: 1.4rem; background: #fff; border: 1px solid var(--line);
      border-radius: 1rem; display: grid; gap: .75rem; align-content: start; text-decoration: none;
    }
    .card:hover { border-color: var(--accent); }
    .card h2 { margin: 0; line-height: 1.25; font-size: 1.45rem; }
    .card p { margin: 0; color: var(--muted); }
    .question-count { width: fit-content; color: var(--accent); font-size: .95rem; font-weight: 700; }
    .practice { width: 100%; height: 100%; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/"><img src="./favicon.svg" alt="">組織實驗複習站</a>
      <nav id="exams" aria-label="組織實驗考試"></nav>
    </div>
  </header>
  <main>
    <section class="home" id="home" aria-labelledby="home-title">
      <div class="home-inner">
        <h1 id="home-title">組織實驗複習站</h1>
        <p class="intro">選擇考試，練習老師講義、伴學講義與線上顯微鏡。</p>
        <div class="cards" id="cards"></div>
        <noscript><p>請啟用 JavaScript 以切換題庫。</p></noscript>
      </div>
    </section>
    <div class="practice" id="practice" hidden></div>
  </main>
  <script type="module">
    // Add an entry here when another lab's practice page is ready.
    const exams = [
      {
        id: '1', title: '組織實-1', page: '../histology-lab-1/',
        topics: '上皮與腺體、結締組織、軟骨與硬骨、皮膚與附屬器、淋巴系統',
        questions: 1386,
      },
      {
        id: '2', title: '組織實-2', page: './practice.html',
        topics: '血液與骨髓、肌肉、心血管',
        questions: 487,
      },
    ];
    const sections = new Set(['teacher', 'companion', 'microscope']);
    const byId = new Map(exams.map(exam => [exam.id, exam]));
    const nav = document.getElementById('exams');
    const cards = document.getElementById('cards');
    const home = document.getElementById('home');
    const practice = document.getElementById('practice');
    const frames = new Map();

    for (const exam of exams) {
      const link = document.createElement('a');
      link.href = '#/' + exam.id;
      link.dataset.exam = exam.id;
      link.textContent = exam.title;
      nav.append(link);

      const card = link.cloneNode();
      card.className = 'card';
      const title = document.createElement('h2');
      title.textContent = exam.title;
      const topics = document.createElement('p');
      topics.textContent = exam.topics;
      const count = document.createElement('span');
      count.className = 'question-count';
      count.textContent = exam.questions.toLocaleString('zh-TW') + ' 題';
      card.replaceChildren(title, topics, count);
      cards.append(card);
    }

    function readRoute() {
      const [first, second] = location.hash.replace(/^#\/?/, '').split('/');
      if (sections.has(first)) return { id: '2', section: first };
      const id = first.replace(/^histology-lab-/, '');
      return { id: byId.has(id) ? id : '', section: sections.has(second) ? second : '' };
    }

    function showExam(exam, section) {
      let frame = frames.get(exam.id);
      if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'exam-' + exam.id;
        frame.title = exam.title;
        frame.addEventListener('load', () => {
          const page = frame.contentDocument;
          if (!page?.head || !page.querySelector('#root')) return;
          const style = page.createElement('style');
          style.textContent = '.site-header, .site-footer { display: none !important; }';
          page.head.append(style);
        });
        frame.src = exam.page + '#/' + (section || 'teacher');
        frames.set(exam.id, frame);
        practice.append(frame);
      } else if (section && frame.contentWindow.location.hash !== '#/' + section) {
        frame.contentWindow.location.replace('#/' + section);
      }
      return frame;
    }

    function render() {
      const { id, section } = readRoute();
      const exam = byId.get(id);
      home.hidden = Boolean(exam);
      practice.hidden = !exam;
      const current = exam ? showExam(exam, section) : null;
      for (const frame of frames.values()) frame.hidden = frame !== current;
      for (const link of nav.children) {
        if (link.dataset.exam === id) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
      document.title = exam ? exam.title + '｜組織實驗複習站' : '組織實驗複習站';
    }

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
